name: Build
on:
  push:
    paths:
      - .github/workflows/build.yml
      - VainSabers/**
      - VainSabers.sln
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Multi-version infrastructure kept – only 1.40.8 active for now (others need UI port, see BSVER_* directives)
          # To re-enable: add entries for 1.29.1, 1.34.2, 1.37.1, 1.42.1 (see git history for URLs)
          - gameVersion: "1.40.8"
            bsmlUrl: "https://github.com/monkeymanboy/BeatSaberMarkupLanguage/releases/download/v1.12.5/BeatSaberMarkupLanguage-v1.12.5+bs.1.40.0-RELEASE.zip"
            siraUrl: "https://github.com/Auros/SiraUtil/releases/download/v3.2.1/SiraUtil-v3.2.1+bs.1.40.0.zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5

      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

      - name: Cache Library
        uses: actions/cache@v5
        with:
          path: VainSabers asset creation/Library
          key: Library-${{ hashFiles('VainSabers asset creation/Assets/**', 'VainSabers asset creation/Packages/**', 'VainSabers asset creation/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Cache Assets
        id: cache-assets
        uses: actions/cache@v5
        with:
          path: |
            VainSabers/VainSabers
            VainSabers/VainSabers.manifest
            VainSabers/vs_assets
            VainSabers/vs_assets.manifest
          key: Assets-${{ hashFiles('VainSabers asset creation/Assets/**', 'VainSabers asset creation/Packages/**', 'VainSabers asset creation/ProjectSettings/**') }}
          restore-keys: |
            Assets-

      - name: Make AssetBundle
        if: ${{ steps.cache-assets.outputs.cache-hit != 'true' }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: "VainSabers asset creation"
          buildMethod: CreateAssetBundles.BuildAllAssetBundles
          targetPlatform: StandaloneWindows64
          allowDirtyBuild: true

      - name: Initialize Modding Environment
        uses: codeman4033/init-beatsaber@v2
        with:
          version: ${{ matrix.gameVersion }}

      - name: Download dependencies
        run: |
          echo "Downloading SiraUtil for ${{ matrix.gameVersion }}: ${{ matrix.siraUrl }}"
          wget "${{ matrix.siraUrl }}" -O SiraUtil.zip
          echo "Downloading BSML for ${{ matrix.gameVersion }}: ${{ matrix.bsmlUrl }}"
          wget "${{ matrix.bsmlUrl }}" -O BSML.zip
          unzip -o SiraUtil.zip -d Refs
          unzip -o BSML.zip -d Refs
          mkdir -p Refs/Plugins || true
          # Some zips extract dlls to root or nested folders; ensure Plugins copies exist
          find Refs -type f -name "SiraUtil.dll" -exec cp -n {} Refs/Plugins/ \; 2>/dev/null || true
          find Refs -type f -name "BSML.dll" -exec cp -n {} Refs/Plugins/ \; 2>/dev/null || true
          echo "Refs contents:"
          ls -R Refs | head -n 200

      - name: Restore dependencies
        run: dotnet restore VainSabers -p:GameVersion=${{ matrix.gameVersion }}

      - name: Create user file
        run: echo '<?xml version="1.0" encoding="utf-8"?><Project><PropertyGroup><BeatSaberDir>${{github.workspace}}/Refs/</BeatSaberDir></PropertyGroup></Project>' > VainSabers/VainSabers.csproj.user

      - name: Build Release
        id: build-release
        run: dotnet publish VainSabers -r win-x64 -c Release -p:GameVersion=${{ matrix.gameVersion }}

      - name: Build Debug
        id: build-debug
        run: dotnet publish VainSabers -r win-x64 -c Debug -p:GameVersion=${{ matrix.gameVersion }}

      - name: Upload Release
        uses: actions/upload-artifact@v7
        with:
          name: VainSabers-${{ env.COMMIT_SHORT_SHA }}-${{ matrix.gameVersion }}-Release.zip
          path: ${{ steps.build-release.outputs.artifactpath }}

      - name: Upload Debug
        uses: actions/upload-artifact@v7
        with:
          name: VainSabers-${{ env.COMMIT_SHORT_SHA }}-${{ matrix.gameVersion }}-Debug.zip
          path: ${{ steps.build-debug.outputs.artifactpath }}
